name: Build Liquid Glass APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate package.properties
        run: echo releaseType=CI > package.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publish to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "Found APK: $APK_FILE"
          TAG="liquid-build$(date +'%m%d%H%M')"
          gh release create "$TAG" "$APK_FILE" \
            --title "Liquid Glass APK $TAG" \
            --notes "iOS液态玻璃主题二改版，自动构建于 $(date +'%Y-%m-%d %H:%M UTC')" \
            --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  emulator-ui:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download APK from Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir . --clobber
          ls -la *.apk

      - name: Enable KVM (root cause of run13 - no accel = 10x slow = SystemUI ANR)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm-dev"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Boot emulator, install, launch, tap, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          force-acceleration: true
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim
          script: bash ./ci/emulator_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-screenshots
          path: shots/
          if-no-files-found: error
